name: CI

on:
  push:
    branches: [main, production-readiness]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: No third-party runtime resources in the bundle
        run: |
          # React's production bundle embeds reactjs.org/react.dev links in its error messages.
          if grep -rEo 'https?://[a-z0-9.-]+' dist/assets/*.js dist/index.html | grep -vE 'fonts\.(googleapis|gstatic)\.com|w3\.org|reactjs\.org|react\.dev' ; then
            echo "unexpected external URL in the build"; exit 1; fi
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No .env tracked
        run: test -z "$(git ls-files | grep -E '(^|/)\.env$')"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ops-manager:ci .
      - name: Runs as non-root
        run: test "$(docker run --rm --entrypoint id ops-manager:ci -u)" = "10001"
      - name: Serves the app, the SPA fallback and security headers
        run: |
          docker run -d --rm --name ops -p 8080:8080 ops-manager:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>'
          curl -fsS http://127.0.0.1:8080/some/client/route | grep -q '<title>'
          curl -sSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          curl -sSI http://127.0.0.1:8080/ | grep -qi '^x-frame-options: DENY'
          docker stop ops
