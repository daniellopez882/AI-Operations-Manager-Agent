server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. add_header is not inherited by a location that sets
    # its own, so none of the locations below use add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets can be cached for a year.
    location /assets/ {
        expires 1y;
    }

    # Single-page app: unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
